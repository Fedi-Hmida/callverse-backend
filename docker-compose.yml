name: callverse

# =============================================================================
# WHY THERE IS NO POSTGRES SERVICE HERE
#
# You will look for one. There isn't one, and that is deliberate.
#
# CallVerse's database is Neon, a hosted serverless PostgreSQL, and it is remote
# in every environment including local development. Adding a postgres service to
# this file would give each developer a private database that drifts from the
# real one: different extensions (pgvector is coming for the RAG knowledge base),
# different connection semantics (Neon's pooled vs direct endpoints, which the
# Flyway configuration depends on), and no cold starts, which are the single
# behaviour most likely to surprise us in production.
#
# Connect to Neon instead. Copy .env.example to .env and fill in the endpoints;
# Neon gives every developer their own branch of the database for free, which is
# the isolation a local container was going to provide anyway.
#
# The one exception is a throwaway container for a smoke test, which is a
# `docker run`, not a service anyone depends on.
# =============================================================================

services:

  backend:
    # Built by Cloud Native Buildpacks, which spring-boot-maven-plugin already
    # supports, so the repository needs no Dockerfile:
    #     ./mvnw spring-boot:build-image
    image: callverse-backend:${CALLVERSE_VERSION:-0.1.0-SNAPSHOT}
    container_name: callverse-backend
    restart: unless-stopped

    # Every value comes from .env, which is git-ignored. No credential is written
    # in this file, and none should ever be.
    env_file:
      - .env

    environment:
      # Fails CLOSED. The dev chain is anyRequest().permitAll(), so defaulting to it
      # meant any host running this file served an unauthenticated API. Set
      # SPRING_PROFILES_ACTIVE=dev explicitly for local work.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Inside the compose network the AI service is reachable by service name,
      # which overrides the localhost default meant for running outside Docker.
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      # OFF unless asked: AUTONOMOUS lets the AI answer until a human advisor writes.
      AI_ADVISOR_MODE: ${AI_ADVISOR_MODE:-OFF}
      INTERNAL_API_PREFIX: ${INTERNAL_API_PREFIX:-/internal}
      # Shared service key. Must match the ai-service's INTERNAL_SERVICE_KEY exactly.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY in .env}

    ports:
      - "${SERVER_PORT:-8080}:8080"

    networks:
      - callverse

    # No container HEALTHCHECK is declared on purpose: the buildpack base image
    # does not ship curl or wget, so the usual one-liner would report unhealthy
    # for the wrong reason. /actuator/health is exposed for the orchestrator to
    # probe from outside, which is where that check belongs.

  ai-service:
    # The Python/FastAPI service running the LangGraph agents and the
    # reinforcement-learning policy, built from ai-service/Dockerfile (CPU only).
    #
    # Behind a compose profile so that `docker compose up` does not need it:
    #   docker compose --profile ai up --build
    profiles:
      - ai
    build: ./ai-service
    image: callverse-ai:${CALLVERSE_AI_VERSION:-local}
    container_name: callverse-ai
    restart: unless-stopped
    # The LLM key, the pgvector DSN and the Quality model live in ai-service/.env
    # (see ai-service/.env.example), never in the image. Optional, so the file can
    # be absent for a run that only exercises the RL policy ("required: false"
    # needs Docker Compose 2.24 or later).
    env_file:
      - path: ai-service/.env
        required: false
    environment:
      # The agents' tools are REST endpoints of the backend, which stays the authority
      # on business rules. The /internal tool API uses the service key below.
      # ai-service/app/config.py reads this exact name (validation alias).
      CALLVERSE_BACKEND_BASE_URL: http://backend:8080
      # Shared service key. Must match the backend's INTERNAL_SERVICE_KEY exactly.
      # The :? syntax fails docker compose up with an explicit error if the variable
      # is missing from .env, rather than starting with an empty key.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY in .env}
      # Required: the AI service itself refuses to start without it (fail closed). Not
      # ":?" here, because Compose interpolates every service, profile or not, and that
      # would break `docker compose up` for anyone who does not run the AI. The backend
      # sends the same value as X-AI-Key.
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    # The embedding model downloads on first use; keep it across containers.
    volumes:
      - ai-model-cache:/home/callverse/.cache
    depends_on:
      - backend
    networks:
      - callverse

volumes:
  ai-model-cache:

networks:
  callverse:
    driver: bridge
