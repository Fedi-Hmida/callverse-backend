# Local development profile. Activate with SPRING_PROFILES_ACTIVE=dev.
# Never enable this profile in a deployed environment: it logs SQL including bound
# parameters, exposes every actuator endpoint and serves Swagger UI unauthenticated.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    # Bound parameter values, which is what makes a logged statement actually reproducible.
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
    com.callverse: DEBUG

management:
  endpoints:
    web:
      exposure:
        # Not "*": the dev chain permits every request, and "*" would publish heapdump (whose
        # memory holds the JWT signing key), env and a writable loggers endpoint, unauthenticated,
        # on a port docker-compose publishes. These four are what development actually uses.
        include: "health,info,metrics,flyway"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
    # The Next.js team generates its TypeScript client from this document.
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Group endpoints by controller rather than by tag ordering, so the growing
    # /api/v1 surface stays navigable as controllers are added.
    operations-sorter: method
    tags-sorter: alpha

spring.devtools:
  restart:
    # Restart only when .reloadtrigger is touched, never on every compiled class. A restart in the
    # middle of `mvn clean install` comes up with half a classpath (without the security chains, so
    # Spring serves its default "Please sign in" page), and every restart runs Flyway, so automatic
    # restarts were pushing work-in-progress migrations to the shared database.
    trigger-file: .reloadtrigger
