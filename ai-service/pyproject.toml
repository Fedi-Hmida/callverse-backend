[project]
name = "callverse-ai-service"
version = "0.1.0"
description = "Service IA CallVerse — Customer Advisor, Client Simulator, Workforce Manager, Quality Analyst"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langchain-core",
    "gymnasium",
    "stable-baselines3",
    "sqlalchemy",
    "pgvector",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
# tests/ only: scripts/ are manual runs that call the LLM at import time.
testpaths = ["tests"]
# Tests that need a real LLM key are opt-in: pytest -m llm
addopts = "--ignore=tests/workforce/test_train_model.py -m 'not llm'"
markers = ["llm: needs a real LLM (GROQ_API_KEY); excluded by default, run with -m llm"]
pythonpath = ["."]
asyncio_mode = "auto"
