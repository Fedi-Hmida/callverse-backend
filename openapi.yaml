          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4ifQ.signature
      required:
      - expiresAt
      - role
      - token
    Transaction:
      type: object
      description: One movement on an account
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          description: "Signed: negative debits the account"
          example: -89.9
        bookedAt:
          type: string
          format: date-time
        counterparty:
          type: string
          description: Any IBAN inside is masked
          example: Loyer DE89 **** **** 3000
          nullable: true
        currency:
          type: string
          example: EUR
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Any IBAN inside is masked
          example: CB MARKET 29/09
        status:
          type: string
          enum:
          - PENDING
          - BOOKED
          - REJECTED
          - DISPUTED
          example: BOOKED
        type:
          type: string
          enum:
          - CARD_PAYMENT
          - ATM_WITHDRAWAL
          - TRANSFER_IN
          - TRANSFER_OUT
          - DIRECT_DEBIT
          - FEE
          - INTEREST
          - REFUND
          example: CARD_PAYMENT
      required:
      - accountId
      - amount
      - bookedAt
      - currency
      - id
      - label
      - status
      - type
    TransactionsResponse:
      type: object
      description: "A customer's recent account movements, newest first"
      properties:
        customerId:
          type: string
          format: uuid
