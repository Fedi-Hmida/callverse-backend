          type: integer
          format: int32
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - number
      - size
      - totalElements
      - totalPages
    QualityView:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        evaluator:
          type: string
        explanation:
          type: string
        globalScore:
          type: number
        id:
          type: string
          format: uuid
        scores:
