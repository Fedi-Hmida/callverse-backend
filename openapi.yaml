          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
      - conversationId
      - messages
    TranscriptMessage:
      type: object
      properties:
        content:
          type: string
        id:
          type: integer
          format: int64
        sender:
          type: string
          enum:
