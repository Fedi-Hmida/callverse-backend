          format: date-time
        channel:
          type: string
          example: CHAT
        customer:
          $ref: "#/components/schemas/SupervisedParty"
        endedAt:
          type: string
          format: date-time
        handleSeconds:
          type: integer
          format: int32
          description: Seconds from assignment to the end; null until it ends
