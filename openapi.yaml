  /api/v1/auth/login:
    post:
      description: "Exchanges an email and password for a signed JWT. An unknown email\
        \ and a wrong password return the same 401 with code INVALID_CREDENTIALS,\
        \ so the endpoint cannot be used to discover which addresses hold accounts.\
        \ Deactivated accounts cannot authenticate."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Rejected before any business rule ran: the body is not valid\
            \ JSON (code MALFORMED_REQUEST), a parameter or field broke a rule (code\
            \ VALIDATION_FAILED), or a use-case precondition was unmet."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Not authenticated. code UNAUTHENTICATED: no bearer token,\
            \ or one that is expired, malformed or wrongly signed - all indistinguishable,\
            \ and the signal to refresh or log in again. code INVALID_CREDENTIALS:\
            \ login refused; an unknown email and a wrong password are deliberately\
            \ indistinguishable."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Authenticated, but not permitted: code ACCESS_DENIED. Re-authenticating\
            \ will not help, so clients must not refresh on it."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "No such route, or a referenced resource does not exist."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A business rule refused the operation. The request was well-formed;
            the current state of the business forbids it.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected failure. message is deliberately generic and carries
            no internal detail; see the server log for the stack trace.
      summary: Log in
      tags:
      - Authentication
