openapi: 3.0.1
info:
  contact:
    email: backend@callverse.local
    name: CallVerse backend
  description: |-
    Backend for CallVerse, a digital twin of a retail bank's customer relation center.

    **Two modes, one API.** Every endpoint behaves identically in live mode (a real person on the customer portal) and simulation mode (synthetic customers driving a reinforcement-learning experiment). The only difference is the source of the customers, expressed in the data as `customer.is_simulated` and `conversation.run_id`.

    **The backend is the authority on business rules.** A commercial credit above an advisor's ceiling is refused here, whoever asks.

    **Conventions.** Routes are versioned under `/api/v1`. UUIDs are exposed publicly and sequence identifiers never are. All timestamps are ISO-8601 UTC. Every failure returns the same envelope — `timestamp`, `status`, `code`, `message`, `path` — and clients branch on `code`, never on `message`.
  license:
    name: Academic project - 3iL / ESPRIT
  title: CallVerse Backend API
  version: 0.1.0-SNAPSHOT
servers:
- description: Local development
  url: http://localhost:8080
- description: Relative to the deployed host
  url: /
tags:
- description: Payment-card actions
  name: Cards
- description: Live supervision
  name: Supervision
- description: Skill queues
  name: Queues
- description: "Customer records and history, for staff"
  name: Customers
- description: Active outages of banking services
  name: Service incidents
- description: Exchanging credentials for an access token
  name: Authentication
- description: Support tickets
  name: Tickets
- description: Internal procedures for staff
  name: Knowledge base
- description: The life of a customer conversation
  name: Conversations
- description: Platform status (walking skeleton)
  name: Health
