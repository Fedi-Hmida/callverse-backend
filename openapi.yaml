components:
  schemas:
    BlockCardRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
          - LOST
          - STOLEN
          - FRAUD_SUSPECTED
          - CUSTOMER_REQUEST
          example: STOLEN
      required:
      - reason
    CardResponse:
      type: object
      description: A payment card
      properties:
        accountId:
          type: string
          format: uuid
        blockReason:
          type: string
          enum:
          - LOST
          - STOLEN
          - FRAUD_SUSPECTED
          - CUSTOMER_REQUEST
          example: STOLEN
          nullable: true
        blockedAt:
          type: string
          format: date-time
          description: Set when the card was blocked
          nullable: true
        expiresOn:
          type: string
          format: date
        id:
          type: string
          format: uuid
        network:
          type: string
          enum:
          - VISA
          - MASTERCARD
          example: VISA
        panLast4:
          type: string
          example: "4242"
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
          - EXPIRED
          - CANCELLED
          example: BLOCKED
        type:
          type: string
          enum:
          - DEBIT
          - CREDIT
          example: DEBIT
      required:
      - accountId
      - expiresOn
      - id
      - network
      - panLast4
      - status
      - type
    Conversation:
      type: object
      properties:
        advisorId:
          type: string
          format: uuid
          description: Null while the conversation waits in its queue
        assignedAt:
          type: string
          format: date-time
        channel:
          type: string
          example: CHAT
        customerId:
          type: string
          format: uuid
        endedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        intent:
          type: string
          example: FRAUD
        queuedAt:
          type: string
          format: date-time
        skill:
          type: string
          example: CARDS
        status:
          type: string
          enum:
          - QUEUED
          - ASSIGNED
          - ACTIVE
          - ESCALATED
          - RESOLVED
          - ABANDONED
          example: ACTIVE
      required:
      - channel
      - customerId
      - id
      - queuedAt
      - skill
      - status
    ConversationList:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      required:
      - conversations
    CurrentUserResponse:
      type: object
      description: "The authenticated caller, read from the verified access token"
      properties:
        email:
          type: string
          example: advisor@callverse.local
        role:
          type: string
          example: ADVISOR
        userId:
          type: string
          format: uuid
          example: 7d3f0c52-6a4e-4b8e-9d1f-2c5a8e9b0f13
      required:
      - email
      - role
      - userId
    CustomerAccount:
      type: object
      description: One account held by the customer
      properties:
        balance:
          type: number
          description: "Signed: negative when overdrawn, and for a loan's outstanding\
            \ capital"
          example: 1523.4
        cards:
          type: array
          description: Cards on this account; empty when there are none
          items:
            $ref: "#/components/schemas/CustomerAccountCard"
        closedAt:
          type: string
          format: date
          description: Null while the account is open
          nullable: true
        currency:
          type: string
          example: EUR
        id:
          type: string
          format: uuid
        maskedIban:
          type: string
          description: The IBAN with all but its first and last four characters masked
          example: FR76 **** **** 0189
        openedAt:
          type: string
          format: date
        overdraftLimit:
          type: number
          example: 500.0
        product:
          $ref: "#/components/schemas/CustomerAccountProduct"
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN
          - CLOSED
          example: ACTIVE
      required:
      - balance
      - cards
      - currency
      - id
      - maskedIban
      - openedAt
      - overdraftLimit
      - product
      - status
    CustomerAccountCard:
      type: object
      description: "A payment card: never more than its last four digits"
      properties:
        expiresOn:
          type: string
          format: date
        id:
          type: string
          format: uuid
        network:
          type: string
          enum:
          - VISA
          - MASTERCARD
          example: VISA
        panLast4:
          type: string
          example: "4242"
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
          - EXPIRED
          - CANCELLED
          example: ACTIVE
        type:
          type: string
          enum:
          - DEBIT
          - CREDIT
          example: DEBIT
      required:
      - expiresOn
      - id
      - network
      - panLast4
      - status
      - type
    CustomerAccountProduct:
      type: object
      description: The product the account is opened on
      properties:
        category:
          type: string
          enum:
          - CURRENT_ACCOUNT
          - SAVINGS
          - CONSUMER_LOAN
          - MORTGAGE
          example: CURRENT_ACCOUNT
        code:
          type: string
          example: CUR_ESSENTIAL
        name:
          type: string
          example: Compte courant Essentiel
      required:
      - category
      - code
      - name
    CustomerResponse:
      type: object
      description: "A bank customer, their accounts and the products they hold"
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAccount"
        externalRef:
          type: string
          description: The bank's customer reference
          example: CUST-00418
        firstName:
          type: string
          example: Amina
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        lastName:
          type: string
          example: Haddad
        region:
          type: string
          description: "Home region, used to match service outages"
          example: Marseille
        segment:
          type: string
          enum:
          - MASS
          - AFFLUENT
          - PRIVATE
          - PROFESSIONAL
          example: MASS
        tenureMonths:
          type: integer
          format: int32
          description: Months since the relationship began
          example: 18
      required:
      - accounts
      - externalRef
      - firstName
      - id
      - lastName
      - region
      - segment
      - tenureMonths
    ErrorResponse:
      type: object
      description: Standard error envelope returned by every CallVerse endpoint
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Customer 'a3f1...' was not found
        path:
          type: string
          example: /api/v1/customers/a3f1
        status:
          type: integer
          format: int32
          example: 404
        timestamp:
          type: string
          format: date-time
          example: 2026-09-14T08:31:07.412Z
      required:
      - code
      - message
      - path
      - status
      - timestamp
    EscalationRequest:
      type: object
      properties:
        reason:
          type: string
          example: "Fraude suspectee, besoin d'un superviseur"
          maxLength: 255
          minLength: 0
      required:
      - reason
    EscalationResponse:
      type: object
      description: An escalation of a conversation to a supervisor
      properties:
        conversationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        raisedBy:
          type: string
          enum:
          - ADVISOR
          - AI
          - RULE
          example: ADVISOR
        reason:
          type: string
        status:
          type: string
          example: PENDING
      required:
      - conversationId
      - createdAt
      - id
      - raisedBy
      - reason
      - status
    HealthStatusResponse:
      type: object
      description: Business-level status of the CallVerse platform
      properties:
        profile:
          type: string
          example: dev
        service:
          type: string
          example: callverse-backend
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
          example: UP
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: 2026-09-14T08:31:07.412Z
        version:
          type: string
          example: 0.1.0-SNAPSHOT
      required:
      - profile
      - service
      - status
      - timestamp
      - version
    KnowledgeArticle:
      type: object
      description: One published article
      properties:
        category:
          type: string
          example: CARDS
        content:
          type: string
        id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        title:
          type: string
          example: Faire opposition a votre carte
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          example: 1
      required:
      - category
      - content
      - id
      - tags
      - title
      - updatedAt
      - version
    KnowledgeArticlesResponse:
      type: object
      description: Published articles matching a search
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeArticle"
        query:
          type: string
          example: opposition carte
      required:
      - articles
      - query
    LiveKpi:
      type: object
      properties:
        abandonRate:
          type: number
          format: double
          description: Abandoned / (resolved + abandoned) today; null when none ended
          example: 0.05
        abandonedToday:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        averageWaitSeconds:
          type: number
          format: double
          description: "Mean wait of today's assigned conversations, in seconds; null\
            \ when none"
        inService:
          type: integer
          format: int64
          description: "Conversations held now: assigned, active or escalated"
        queues:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
        resolvedToday:
          type: integer
          format: int64
        schemaVersion:
          type: integer
          format: int32
          example: 1
        since:
          type: string
          format: date-time
          description: Local midnight in the operations time zone
        slaRatio:
          type: number
          format: double
          description: Share of today's assigned conversations answered within the
            SLA target; null when none
          example: 0.94
        waitingTotal:
          type: integer
          format: int64
      required:
      - abandonedToday
      - at
      - inService
      - queues
      - resolvedToday
      - schemaVersion
      - since
      - waitingTotal
    LoginRequest:
      type: object
      description: Credentials submitted for authentication
      properties:
        email:
          type: string
          example: advisor@callverse.local
        password:
          type: string
          description: "Never logged, never echoed back"
          example: your-password
      required:
      - email
      - password
    Message:
      type: object
      properties:
        content:
          type: string
        conversationId:
          type: string
          format: uuid
        id:
          type: integer
          format: int64
        sender:
          type: string
          enum:
          - CUSTOMER
          - ADVISOR
          - SYSTEM
          example: ADVISOR
        sentAt:
          type: string
          format: date-time
      required:
      - content
      - conversationId
      - id
      - sender
      - sentAt
    MessageRequest:
      type: object
      properties:
        content:
          type: string
          example: Je bloque votre carte tout de suite.
          maxLength: 2000
          minLength: 0
      required:
      - content
    OpenConversationRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        intent:
          type: string
          description: "What the contact is about, when known"
          enum:
          - BALANCE
          - CARD
          - CREDIT
          - FRAUD
          - ACCOUNT_CLOSURE
          - OTHER
          example: FRAUD
        skill:
          type: string
          example: CARDS
          pattern: "[A-Za-z0-9_-]{1,30}"
      required:
      - customerId
      - skill
    OpenTicketRequest:
      type: object
      properties:
        category:
          type: string
          example: FRAUD
          maxLength: 30
          minLength: 0
          pattern: "[A-Z][A-Z_]*"
        conversationId:
          type: string
          format: uuid
          description: "When given, must belong to customerId"
          nullable: true
        customerId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 4000
          minLength: 0
          nullable: true
        severity:
          type: integer
          format: int32
          description: "1 to 5, default 3"
          example: 3
          maximum: 5
          minimum: 1
          nullable: true
        title:
          type: string
          example: Paiements inconnus a l'etranger
          maxLength: 200
          minLength: 0
      required:
      - category
      - customerId
      - title
    Queue:
      type: object
      properties:
        oldestWaitSeconds:
          type: integer
          format: int32
          description: Seconds the oldest waiting conversation has waited; null when
            none waits
          example: 42
        skill:
          type: string
          example: FRAUD
        waiting:
          type: integer
          format: int64
          example: 3
      required:
      - skill
      - waiting
    Queues:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
      required:
      - queues
    ServiceIncident:
      type: object
      description: One active outage
      properties:
        affectedCount:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          example: Card authorisations failing
          nullable: true
        estimatedEnd:
          type: string
          format: date-time
          description: What the customer can be told
          nullable: true
        id:
          type: string
          format: uuid
        region:
          type: string
          description: Null for a national outage
          example: Marseille
          nullable: true
        service:
          type: string
          enum:
          - CARD_PAYMENTS
          - ONLINE_BANKING
          - MOBILE_APP
          - ATM_NETWORK
          - TRANSFERS
          example: CARD_PAYMENTS
        severity:
          type: integer
          format: int32
          description: 1 (worst) to 5
          example: 2
        startedAt:
          type: string
          format: date-time
      required:
      - id
      - service
      - severity
      - startedAt
    ServiceIncidentsResponse:
      type: object
      description: Active outages of banking services
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/ServiceIncident"
      required:
      - incidents
    TicketResponse:
      type: object
      description: A support ticket
      properties:
        category:
          type: string
          example: FRAUD
        conversationId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        severity:
          type: integer
          format: int32
          description: 1 (most severe) to 5
          example: 2
        status:
          type: string
          example: OPEN
        title:
          type: string
          example: Paiements inconnus a l'etranger
      required:
      - category
      - createdAt
      - customerId
      - id
      - severity
      - status
      - title
    TokenResponse:
      type: object
      description: An access token and the instant it expires
      properties:
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 UTC
          example: 2026-09-25T12:00:00Z
        role:
          type: string
          enum:
          - CUSTOMER
          - ADVISOR
          - SUPERVISOR
          - ADMIN
          example: ADVISOR
        token:
          type: string
          description: "Signed JWT. Send as: Authorization: Bearer <token>"
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4ifQ.signature
      required:
      - expiresAt
      - role
      - token
    Transaction:
      type: object
      description: One movement on an account
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          description: "Signed: negative debits the account"
          example: -89.9
        bookedAt:
          type: string
          format: date-time
        counterparty:
          type: string
          description: Any IBAN inside is masked
          example: Loyer DE89 **** **** 3000
          nullable: true
        currency:
          type: string
          example: EUR
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Any IBAN inside is masked
          example: CB MARKET 29/09
        status:
          type: string
          enum:
          - PENDING
          - BOOKED
          - REJECTED
          - DISPUTED
          example: BOOKED
        type:
          type: string
          enum:
          - CARD_PAYMENT
          - ATM_WITHDRAWAL
          - TRANSFER_IN
          - TRANSFER_OUT
          - DIRECT_DEBIT
          - FEE
          - INTEREST
          - REFUND
          example: CARD_PAYMENT
      required:
      - accountId
      - amount
      - bookedAt
      - currency
      - id
      - label
      - status
      - type
    TransactionsResponse:
      type: object
      description: "A customer's recent account movements, newest first"
      properties:
        customerId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
      required:
      - customerId
      - transactions
    Transcript:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
      - conversationId
      - messages
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: |-
        User access token from `POST /api/v1/auth/login`. Carries the account identifier and one role of CUSTOMER, ADVISOR, SUPERVISOR or ADMIN.

        HS512, valid for one hour by default. Missing, expired or invalid: 401 UNAUTHENTICATED.
      scheme: bearer
      type: http
