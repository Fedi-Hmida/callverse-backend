      properties:
        category:
          type: string
          example: FRAUD
        conversationId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        severity:
          type: integer
          format: int32
