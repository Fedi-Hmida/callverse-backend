          - BALANCE
          - CARD
          - CREDIT
          - FRAUD
          - ACCOUNT_CLOSURE
          - OTHER
          example: FRAUD
        skill:
          type: string
          example: CARDS
          pattern: "[A-Za-z0-9_-]{1,30}"
      required:
      - customerId
      - skill
    OpenTicketRequest:
      type: object
      properties:
        category:
          type: string
          example: FRAUD
          maxLength: 30
          minLength: 0
          pattern: "[A-Z][A-Z_]*"
        conversationId:
          type: string
          format: uuid
          description: "When given, must belong to customerId"
          nullable: true
        customerId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 4000
          minLength: 0
          nullable: true
        severity:
          type: integer
          format: int32
          description: "1 to 5, default 3"
          example: 3
          maximum: 5
          minimum: 1
          nullable: true
        title:
          type: string
          example: Paiements inconnus a l'etranger
          maxLength: 200
          minLength: 0
      required:
      - category
      - customerId
      - title
    Options:
      type: object
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioOption"
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyOption"
    Page:
