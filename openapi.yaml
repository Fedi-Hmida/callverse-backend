          type: string
    ServiceIncident:
      type: object
      description: One active outage
      properties:
        affectedCount:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          example: Card authorisations failing
          nullable: true
        estimatedEnd:
          type: string
          format: date-time
          description: What the customer can be told
          nullable: true
        id:
          type: string
          format: uuid
        region:
          type: string
          description: Null for a national outage
