        runId:
          type: string
          format: uuid
        scenarioId:
          type: string
          format: uuid
        seed:
          type: integer
          format: int64
          example: 7
        startedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
        strategyCode:
          type: string
          example: RL_PPO_V1
      required:
      - runId
      - scenarioId
      - seed
      - status
      - strategyCode
    TwinRunKpis:
      type: object
      description: Null until COMPLETED
      properties:
        abandonRatio:
          type: number
          format: double
          example: 0.0673
        avgWaitSeconds:
          type: number
          format: double
          example: 41.23
        p95WaitSeconds:
          type: number
          format: double
          example: 158.79
        slaRatio:
          type: number
          format: double
          example: 0.8512
        totalConversations:
          type: integer
          format: int32
          description: Customers who arrived during the simulated day
      required:
      - abandonRatio
      - avgWaitSeconds
      - p95WaitSeconds
      - slaRatio
      - totalConversations
    User:
      type: object
      properties:
        active:
          type: boolean
          description: "False once blocked: the account can neither log in nor act"
        createdAt:
          type: string
          format: date-time
        email:
          type: string
          example: karim.benali@bank.fr
        firstName:
          type: string
          example: Karim
        id:
          type: string
          format: uuid
        lastName:
          type: string
          example: Benali
        role:
          type: string
          enum:
          - CUSTOMER
          - ADVISOR
          - SUPERVISOR
          - ADMIN
          example: ADVISOR
      required:
      - active
      - createdAt
      - email
      - firstName
      - id
      - lastName
      - role
    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
      - content
      - page
    WorkforceObservedState:
      type: object
      properties:
        available:
          type: object
          additionalProperties:
            type: integer
            format: int32
        averageWaitSeconds:
          type: object
          additionalProperties:
            type: number
            format: double
        hour:
          type: integer
          format: int32
        queues:
          type: object
          additionalProperties:
            type: integer
            format: int64
        slaMeasured:
          type: boolean
        slaToday:
          type: number
          format: double
        trend:
          type: number
          format: double
      required:
      - available
      - averageWaitSeconds
      - hour
      - queues
      - slaMeasured
      - slaToday
      - trend
    WorkforceRecommendation:
      type: object
      properties:
        caveats:
          type: array
          items:
            type: string
        count:
          type: integer
          format: int32
        decisionId:
          type: integer
          format: int64
        expectedGain:
          type: object
          additionalProperties:
            type: number
            format: double
        fromPool:
          type: string
          enum:
          - ACCOUNTS
          - CARDS
          - CREDIT
          - FRAUD
        generatedAt:
          type: string
          format: date-time
        observation:
          $ref: "#/components/schemas/WorkforceObservedState"
        reason:
          type: string
        requiresApproval:
          type: boolean
          description: This proposal has not been applied and requires human review.
        toPool:
          type: string
          enum:
          - ACCOUNTS
          - CARDS
          - CREDIT
          - FRAUD
        type:
          type: string
          enum:
          - NONE
          - REASSIGN
      required:
      - caveats
      - decisionId
      - expectedGain
      - generatedAt
      - observation
      - reason
      - requiresApproval
      - type
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: |-
        User access token from `POST /api/v1/auth/login`. Carries the account identifier and one role of CUSTOMER, ADVISOR, SUPERVISOR or ADMIN.

        HS512, valid for one hour by default. Missing, expired or invalid: 401 UNAUTHENTICATED.
      scheme: bearer
      type: http
    serviceKey:
      description: "Shared service key for `/internal/**`, used by the Python AI service.\
        \ Not a user credential: it carries no role and no identity. Required on every\
        \ internal route in every profile; missing or wrong: 401 UNAUTHENTICATED."
      in: header
      name: X-Internal-Key
      type: apiKey
